[project]
name = "analyse-economic-cycle"
version = "2.0.0"
description = "Multi-factor economic cycle detection and sector rotation analysis for Indian markets"
requires-python = ">=3.9"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Farseen" }]

dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "kiteconnect>=5.0.0",
    "yfinance>=0.2.40",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "requests>=2.32.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.4.0",
    "tabulate>=0.9.0",
    "colorama>=0.4.0",
    "growwapi>=1.5.0",
    "pyotp>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.9.0",
    "ruff>=0.3.0",
]
swing = [
    "growwapi>=1.5.0",
    "pyotp>=2.9.0",
]

[tool.ruff]
target-version = "py39"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
